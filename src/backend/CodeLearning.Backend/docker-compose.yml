services:
  postgres:
    image: postgres:18-alpine
    container_name: codelearning-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - codelearning-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: codelearning-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - codelearning-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: codelearning-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - codelearning-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # DockerGuard - the only way the Runner reaches the Docker daemon
  # Allows just the calls DockerRunner makes. Container creation is checked field by field
  # (allowed executor images, network none, non-root user, every capability dropped, no host
  # mounts, no privileged mode) and only the checked fields are forwarded. Start, kill, logs,
  # archive and remove work only on containers labelled codelearning.sandbox=true
  docker-guard:
    image: ${DOCKER_REGISTRY-}codelearningdockerguard
    container_name: codelearning-docker-guard
    build:
      context: .
      dockerfile: CodeLearning.DockerGuard/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # The image runs as a non-root user; this group grants it the socket.
    # Docker Desktop's socket belongs to group 0, Docker Engine's to the "docker" group (stat -c %g /var/run/docker.sock)
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    networks:
      - codelearning-network
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    image: ${DOCKER_REGISTRY-}codelearningapi
    container_name: codelearning-api
    build:
      context: .
      dockerfile: CodeLearning.Api/Dockerfile
    ports:
      - "5000:8080"
      - "5001:8081"
    volumes:
      - dataprotection-keys:/app/keys
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMqTransport__Host: rabbitmq
      RabbitMqTransport__User: ${RABBITMQ_USER}
      RabbitMqTransport__Pass: ${RABBITMQ_PASSWORD}
      Database__AutoMigrate: "true"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: "CodeLearningApi"
      JwtSettings__Audience: "CodeLearningClient"
      JwtSettings__AccessTokenExpirationMinutes: "5"
      JwtSettings__RefreshTokenExpirationDays: "7"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - codelearning-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  runner:
    image: ${DOCKER_REGISTRY-}codelearningrunner
    container_name: codelearning-runner
    build:
      context: .
      dockerfile: CodeLearning.Runner/Dockerfile
    volumes:
      - runner-workspace:/tmp/submissions
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RabbitMqTransport__Host: rabbitmq
      RabbitMqTransport__User: ${RABBITMQ_USER}
      RabbitMqTransport__Pass: ${RABBITMQ_PASSWORD}
      ExecutionSettings__DockerHost: "tcp://docker-guard:2375"
      ExecutionSettings__WorkspaceBasePath: "/tmp/submissions"
      ExecutionSettings__MaxConcurrentExecutions: "5"
      Serilog__MinimumLevel__Default: "Debug"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      docker-guard:
        condition: service_started
    networks:
      - codelearning-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true  # Prevent privilege escalation
    deploy:
      resources:
        limits:
          cpus: '2'      # Limit CPU usage
          memory: 2G     # Limit memory usage

  frontend:
    image: ${DOCKER_REGISTRY-}codelearningfrontend
    container_name: codelearning-frontend
    build:
      context: ../../frontend/codelearning-frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ../../frontend/codelearning-frontend:/app
      - /app/node_modules
    environment:
      WATCHPACK_POLLING: "true"
    depends_on:
      api:
        condition: service_started
    networks:
      - codelearning-network
    restart: unless-stopped

  # Executor Images (build-only, not running)
  # These images are used by Runner to execute student code
  # Build them with: docker compose build executor-python executor-node executor-csharp executor-java
  
  executor-python:
    image: codelearning/python:3.12-slim
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    profiles:
      - executors

  executor-node:
    image: codelearning/node:22-slim
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    profiles:
      - executors

  executor-csharp:
    image: codelearning/dotnet:10.0
    build:
      context: .
      dockerfile: docker/csharp/Dockerfile
    profiles:
      - executors

  executor-java:
    image: codelearning/java:21-jdk
    build:
      context: .
      dockerfile: docker/java/Dockerfile
    profiles:
      - executors

networks:
  codelearning-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  dataprotection-keys:
    driver: local
  runner-workspace:
    driver: local
