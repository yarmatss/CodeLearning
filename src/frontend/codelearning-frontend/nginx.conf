# Serves the built Angular SPA and proxies /api to the API container.
# TLS, when used, is terminated by a proxy in front of this one.

# Keep the scheme a TLS proxy in front of us reported; otherwise use our own
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ^~ so the static-file regex below never captures API paths
    location ^~ /api/ {
        # Docker's embedded DNS; resolving per request means nginx starts even if the API is
        # restarting and follows its new address
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API trusts these only from the compose network (ForwardedHeaders:KnownNetworks)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Bundles with a content hash in the name never change, so they can be cached for good
    location ~* "-[a-z0-9]{8,}\.(?:js|css|woff2?|ttf|svg|png|jpe?g|gif|ico|webp)$" {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html is never cached so a deploy is picked up on the next load
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Client-side routes fall back to the SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
